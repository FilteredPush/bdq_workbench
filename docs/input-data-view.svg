<svg width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="Flattened view over grain table occurrence: 3 of 6 input tables used, 1 ignored for lacking test bindings" xmlns="http://www.w3.org/2000/svg">
<style>
svg { font-family: sans-serif; }
.vw-box rect { stroke-width: 1.5; }
.vw-box text { font-size: 12px; fill: #1f2328; }
.vw-box text.vw-name { font-size: 13px; font-weight: 600; }
.vw-box text.vw-meta { fill: #57606a; }
.vw-grain rect { fill: #ddf4ff; stroke: #0969da; }
.vw-contrib rect { fill: #dafbe1; stroke: #1a7f37; }
.vw-notincl rect { fill: #fff8c5; stroke: #9a6700; stroke-dasharray: 2 3; }
.vw-ignored rect { fill: #f6f8fa; stroke: #8c959f; stroke-dasharray: 5 3; }
.vw-ident rect { fill: #f6f8fa; stroke: #0969da; stroke-dasharray: 5 3; }
.vw-ignored text, .vw-notincl text, .vw-ident text { fill: #57606a; }
.vw-view rect { fill: #fbefff; stroke: #8250df; stroke-width: 2; }
.vw-expanded rect { fill: #ffffff; stroke-dasharray: 6 3; }
.vw-rel { fill: none; stroke: #57606a; stroke-width: 1.5; }
.vw-rel.inactive { stroke: #afb8c1; stroke-dasharray: 3 3; }
.vw-flow { fill: none; stroke: #8250df; stroke-width: 1.5; }
.vw-flow-label { font-size: 11px; fill: #8250df; }
.vw-caption { font-size: 12px; font-weight: 600; fill: #57606a; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>

