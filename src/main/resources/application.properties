# Left blank so a command line run falls back to the ratified sources published at
# bdq.tdwg.org (the same defaults the GUI shows); set either to a local path or an HTTP URL
# to pin a run to specific definitions.
bdq.usecase.file=
bdq.rdf.files=
bdq.dataset=dataset.zip
bdq.dataset.table=
bdq.dataset.view=
# Multiplicity handling for a multi-table dataset run without a view: table=POLICY, comma-separated
# (EXPAND, FIRST_ROW, AGGREGATE, REJECT); needed for each related table with more than one row per record.
bdq.dataset.join.policies=
bdq.usecase.id=
bdq.discovery.packages=org.filteredpush
bdq.threads=4
bdq.execution.dedup=true
bdq.record.filters=
# Sharing the worker pool between external services and local work (see README, "Execution
# scheduling and resilience"). Each test runs in a resource lane; lanes of likely external
# services (tests with a source-authority parameter) run at most this many calls at once.
bdq.execution.lanes=true
bdq.execution.concurrency.external=2
bdq.execution.concurrency.unclassified=4
# 0 means the whole worker pool (bdq.threads).
bdq.execution.concurrency.local=0
# Halve a lane's limit on transient external failures and open its circuit after this many
# consecutive ones (0 disables the circuit breaker); cooldown doubles up to the maximum.
bdq.execution.adaptive=true
bdq.execution.circuit.failures=3
bdq.execution.circuit.cooldown.ms=5000
bdq.execution.circuit.cooldown.max.ms=60000
# Workbench-level retries of transient external failures (0 disables), with exponential backoff.
bdq.execution.retries=2
bdq.execution.retry.delay.ms=500
bdq.execution.retry.delay.max.ms=8000
# Reuse a successful PRE_AMENDMENT result in POST_AMENDMENT when amendments left its inputs unchanged.
bdq.execution.reuse=true
# Per-test/implementation overrides, target=spec separated by ';', spec from external|local|unclassified,
# lane:NAME, max:N; e.g. org.filteredpush.qc.georeference.DwCGeoRefDQDefaults=external,lane:worms,max:1
bdq.execution.overrides=
# Per-lane limits, laneKey=N separated by ';'; e.g. source:worms=1
bdq.execution.lane.limits=
